<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>የጥያቄ መቀበያ ገፅ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
    }
    h2 {
      color: #333;
      text-align: center;
      margin-bottom: 20px;
    }
    .contact-info {
      background-color: #eef2f5;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 25px;
    }
    .contact-info p {
      margin: 8px 0;
      color: #555;
    }
    .contact-info a {
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }
    .contact-info a:hover {
      text-decoration: underline;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #333;
      font-weight: bold;
    }
    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 14px;
    }
    textarea {
      height: 120px;
      resize: vertical;
    }
    button {
      width: 100%;
      background-color: #28a745;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>ጥያቄዎች ካሉዎት ይላኩልን</h2>

  <!-- የአድራሻ እና ስልክ መረጃ -->
  <div class="contact-info">
    <p><strong>ስልክ፡</strong> <a href="tel:0962244464">0962244464</a></p>
    <p><strong>ኢሜይል፡</strong> <a href="mailto:your-email@gmail.com">your-email@gmail.com</a></p>
  </div>

  <!-- የጥያቄ መላኪያ ፎርም -->
  <!-- ማስታወሻ፡ YOUR_FORM_ID በሚለው ቦታ ከ formspree.io ያገኘኸውን ID ታስገባለህ -->
  <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
    <div class="form-group">
      <label for="name">ስምዎን ያስገቡ፡</label>
      <input type="text" id="name" name="name" placeholder="ሙሉ ስም" required>
    </div>

    <div class="form-group">
      <label for="email">ኢሜይልዎን ያስገቡ፡</label>
      <input type="email" id="email" name="_replyto" placeholder="example@gmail.com" required>
    </div>

    <div class="form-group">
      <label for="message">ጥያቄዎ፡</label>
      <textarea id="message" name="message" placeholder="ጥያቄዎን እዚህ ጋር ይፃፉ..." required></textarea>
    </div>

    <button type="submit">ጥያቄውን ላክ</button>
  </form>
</div>

</body>
</html>
