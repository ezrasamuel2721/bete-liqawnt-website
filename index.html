<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description"
content="ቤተ ሊቃውንት - የእውቀት፣ የትምህርትና የምርምር ማዕከል">

<title>ቤተ ሊቃውንት | Bete Likawunt</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,"Noto Sans Ethiopic","Abyssinica SIL",sans-serif;
  background:#f8faf7;
  color:#26352e;
  line-height:1.7;
}

a{
  text-decoration:none;
  color:inherit;
}

button{
  font-family:inherit;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,255,255,.97);
  border-bottom:1px solid #dce6df;
  box-shadow:0 2px 12px rgba(0,0,0,.05);
}

.header-inner{
  max-width:1150px;
  margin:auto;
  padding:13px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:22px;
  font-weight:900;
  color:#245c45;
  line-height:1.2;
}

.logo small{
  display:block;
  margin-top:2px;
  font-size:10px;
  letter-spacing:2px;
  color:#79927f;
}

nav{
  display:flex;
  align-items:center;
  gap:6px;
}

nav a{
  padding:9px 12px;
  border-radius:8px;
  font-size:14px;
  font-weight:bold;
  color:#42564c;
}

nav a:hover{
  background:#eaf3ed;
  color:#245c45;
}

.language-btn{
  border:1px solid #cbdacf;
  background:#f2f7f3;
  color:#245c45;
  padding:8px 12px;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
}

.menu-btn{
  display:none;
  border:0;
  background:#edf4ef;
  color:#245c45;
  font-size:24px;
  padding:5px 10px;
  border-radius:8px;
  cursor:pointer;
}

/* HERO */
.hero{
  background:
    radial-gradient(circle at 85% 20%,rgba(74,125,93,.18),transparent 30%),
    linear-gradient(135deg,#edf6f0,#f9fbf9);
  padding:85px 20px 75px;
}

.hero-inner{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:1.15fr .85fr;
  align-items:center;
  gap:55px;
}

.badge{
  display:inline-block;
  background:#dceee3;
  color:#245c45;
  padding:6px 13px;
  border-radius:30px;
  font-size:13px;
  font-weight:bold;
  margin-bottom:18px;
}

.hero h1{
  font-size:clamp(38px,6vw,66px);
  line-height:1.15;
  color:#204d3a;
  margin-bottom:20px;
}

.hero h1 span{
  color:#78904a;
}

.hero p{
  font-size:18px;
  max-width:650px;
  color:#53665c;
  margin-bottom:28px;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

.btn{
  display:inline-block;
  padding:12px 20px;
  border-radius:10px;
  font-weight:bold;
  transition:.2s;
}

.btn-primary{
  background:#245c45;
  color:white;
}

.btn-primary:hover{
  background:#184631;
  transform:translateY(-1px);
}

.btn-secondary{
  border:1px solid #b9cdbf;
  background:white;
  color:#245c45;
}

.btn-secondary:hover{
  background:#edf5ef;
}

.hero-card{
  background:white;
  border:1px solid #dbe7df;
  border-radius:22px;
  padding:35px;
  box-shadow:0 15px 45px rgba(33,74,52,.10);
  text-align:center;
}

.hero-symbol{
  width:105px;
  height:105px;
  margin:0 auto 20px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#e3f0e7;
  color:#245c45;
  font-size:52px;
}

.hero-card h2{
  color:#245c45;
  margin-bottom:8px;
}

.hero-card p{
  font-size:15px;
  margin:0;
}

/* GENERAL */
section{
  padding:75px 20px;
}

.container{
  max-width:1100px;
  margin:auto;
}

.section-title{
  text-align:center;
  margin-bottom:42px;
}

.section-title .eyebrow{
  color:#78904a;
  font-size:13px;
  font-weight:900;
  letter-spacing:1px;
}

.section-title h2{
  font-size:34px;
  color:#245c45;
  margin:7px 0 10px;
}

.section-title p{
  max-width:650px;
  margin:auto;
  color:#66776e;
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.card{
  background:white;
  border:1px solid #dce7df;
  border-radius:15px;
  padding:27px;
  transition:.2s;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 30px rgba(0,0,0,.07);
}

.icon{
  width:48px;
  height:48px;
  border-radius:12px;
  background:#e6f1e9;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  margin-bottom:17px;
}

.card h3{
  color:#285b45;
  margin-bottom:8px;
}

.card p{
  color:#63736a;
  font-size:15px;
}

/* ABOUT */
.about{
  background:#eef5f0;
}

.about-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:45px;
  align-items:center;
}

.about-box{
  background:white;
  border-radius:18px;
  padding:35px;
  border:1px solid #d9e5dc;
}

.about-box h2{
  color:#245c45;
  font-size:32px;
  margin-bottom:15px;
}

.about-box p{
  color:#596b61;
  margin-bottom:15px;
}

.checks{
  list-style:none;
  margin-top:20px;
}

.checks li{
  margin:9px 0;
  color:#3d5548;
}

.checks li::before{
  content:"✓";
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:22px;
  height:22px;
  background:#dceee2;
  color:#245c45;
  border-radius:50%;
  margin-right:8px;
  font-weight:bold;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.stat{
  background:#245c45;
  color:white;
  border-radius:14px;
  padding:25px 15px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:30px;
}

.stat span{
  font-size:13px;
  opacity:.9;
}

/* RESOURCES */
.resource-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.resource{
  display:flex;
  gap:18px;
  align-items:flex-start;
  background:white;
  border:1px solid #dce7df;
  border-radius:14px;
  padding:22px;
}

.resource-icon{
  font-size:28px;
}

.resource h3{
  color:#285b45;
  margin-bottom:4px;
}

.resource p{
  color:#66766d;
  font-size:14px;
}

/* CONTACT */
.contact{
  background:#f0f6f2;
}

.contact-box{
  background:#245c45;
  color:white;
  border-radius:22px;
  padding:45px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
}

.contact-box h2{
  font-size:32px;
  margin-bottom:12px;
}

.contact-box p{
  opacity:.9;
}

.contact-info{
  display:grid;
  gap:12px;
}

.contact-item{
  background:rgba
