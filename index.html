        <nav>

    <!-- Call Info Section -->
    <section id="call" class="call-info-section">
        <h2>በአጭር የስልክ መስመር 2721 ይደውሉ</h2>
        <p>የአገልግሎት ሰዓት መመሪያዎችን ከመምህራነ ሃይማኖት አባቶች ጋር የቃል በቃል ውይይት ለማድረግ</p>
        <a href="tel:2721" class="btn-call-large">2721 ይደውሉ</a>
