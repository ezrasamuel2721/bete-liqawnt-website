<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ቤተ ሊቃውንት</title>

<meta name="description"
content="ቤተ ሊቃውንት - የመንፈሳዊ ጥያቄና መልስ የጥሪ ማዕከል።">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,"Noto Sans Ethiopic",sans-serif;
  background:#f7f3e9;
  color:#24352b;
  line-height:1.7;
}

a{
  text-decoration:none;
}

.container{
  width:min(1100px,92%);
  margin:auto;
}

/* HEADER */
header{
  background:#fffdf7;
  position:sticky;
  top:0;
  z-index:1000;
  border-bottom:2px solid #c9a227;
}

.nav{
  min-height:75px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  color:#164734;
  font-size:22px;
  font-weight:800;
}

.logo span{
  color:#b08a24;
}

nav{
  display:flex;
  align-items:center;
  gap:20px;
}

nav a{
  color:#34483b;
  font-weight:600;
}

nav a:hover{
  color:#a67c17;
}

.lang-btn{
  border:1px solid #c9a227;
  background:#fffdf7;
  padding:8px 13px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  color:#164734;
}

.menu-btn{
  display:none;
  border:0;
  background:none;
  font-size:28px;
  cursor:pointer;
}

/* HERO */
.hero{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at top,#386b52 0,#1d513a 45%,#12372a 100%);
  color:white;
  text-align:center;
  padding:85px 15px;
}

.hero:before,
.hero:after{
  content:"✝";
  position:absolute;
  color:rgba(201,162,39,.12);
  font-size:180px;
  font-weight:bold;
}

.hero:before{
  left:5%;
  top:10%;
}

.hero:after{
  right:5%;
  bottom:0;
}

.hero-logo{
  position:relative;
  z-index:1;
  width:115px;
  height:115px;
  margin:0 auto 20px;
  border-radius:50%;
  background:#fffdf7;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#164734;
  font-size:48px;
  font-weight:bold;
  border:5px solid #c9a227;
  box-shadow:0 8px 30px rgba(0,0,0,.25);
}

.hero-church,
.hero-name,
.hero-subtitle,
.hero h1,
.hero-text,
.hero .btn{
  position:relative;
  z-index:1;
}

.hero-church{
  font-size:20px;
  font-weight:bold;
  margin-bottom:5px;
}

.hero-name{
  font-size:44px;
  font-weight:900;
  color:#f2d77a;
  margin-bottom:5px;
}

.hero-subtitle{
  font-size:19px;
  margin-bottom:22px;
}

.hero h1{
  font-size:30px;
  margin-bottom:12px;
}

.hero-text{
  max-width:720px;
  margin:auto;
  font-size:18px;
}

.btn{
  display:inline-block;
  margin-top:25px;
  padding:13px 24px;
  border-radius:9px;
  background:#f2d77a;
  color:#173d2d;
  font-weight:bold;
  border:2px solid #c9a227;
  cursor:pointer;
}

.btn:hover{
  background:#fff1b0;
}

/* SECTIONS */
section{
  padding:70px 0;
}

.section-title{
  text-align:center;
  margin-bottom:35px;
}

.section-title h2{
  color:#164734;
  font-size:32px;
  position:relative;
  display:inline-block;
}

.section-title h2:after{
  content:"✦";
  display:block;
  color:#c9a227;
  font-size:18px;
}

.section-title p{
  color:#66756c;
}

/* ASK */
.ask-box{
  background:#fffdf7;
  padding:30px;
  border-radius:15px;
  border:1px solid #dccb8b;
  box-shadow:0 7px 25px rgba(46,60,50,.08);
  max-width:800px;
  margin:auto;
}

.ask-box input,
.ask-box textarea{
  width:100%;
  padding:14px;
  border:1px solid #d5c99e;
  border-radius:9px;
  margin-bottom:15px;
  font-size:16px;
  font-family:inherit;
  background:#fffefb;
}

.ask-box input:focus,
.ask-box textarea:focus,
.search input:focus{
  outline:none;
  border-color:#b08a24;
  box-shadow:0 0 0 3px rgba(201,162,39,.12);
}

.ask-box textarea{
  min-height:150px;
  resize:vertical;
}

.submit-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:9px;
  background:#164734;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.submit-btn:hover{
  background:#216046;
}

.success{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  background:#e7f3e9;
  color:#17633d;
  text-align:center;
}

/* SEARCH */
.search{
  max-width:700px;
  margin:0 auto 30px;
}

.search input{
  width:100%;
  padding:15px;
  border:1px solid #d5c99e;
  border-radius:10px;
  font-size:16px;
  background:#fffdf7;
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.card{
  background:#fffdf7;
  border-radius:14px;
  padding:25px;
  border:1px solid #dccb8b;
  box-shadow:0 5px 18px rgba(46,60,50,.06);
}

.card .icon{
  font-size:35px;
}

.card h3{
  color:#164734;
  margin:10px 0;
}

.card p{
  color:#66756c;
}

/* ABOUT */
.about{
  background:#fffdf7;
  border-top:1px solid #e4d8a9;
  border-bottom:1px solid #e4d8a9;
}

.about-text{
  max-width:800px;
  margin:auto;
  text-align:center;
  font-size:18px;
  color:#4d5b53;
}

/* CONTACT */
.contact-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.contact-card{
  background:#fffdf7;
  padding:28px;
  text-align:center
