<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ቤተ ሊቃውንት | Bete-Liqawunt</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans Ethiopic", sans-serif;
      background: #f5f1e6;
      color: #183b2b;
      line-height: 1.7;
    }

    header {
      background: linear-gradient(135deg, #164a35, #286846);
      color: white;
      padding: 22px 16px;
      text-align: center;
    }

    .logo {
      width: 105px;
      height: 105px;
      margin: 0 auto 12px;
      border: 3px solid #d6b35a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      background: #fff;
      color: #164a35;
    }

    .brand {
      font-size: 27px;
      font-weight: bold;
      color: #f2d47b;
    }

    .subtitle {
      margin-top: 5px;
      font-size: 15px;
    }

    .number {
      display: inline-block;
      margin-top: 12px;
      background: #d6b35a;
      color: #173b2b;
      padding: 7px 22px;
      border-radius: 25px;
      font-size: 25px;
      font-weight: bold;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #123d2c;
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 9px;
    }

    nav button {
      border: 0;
      border-radius: 20px;
      padding: 9px 14px;
      background: transparent;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    nav button:hover {
      background: #286846;
    }

    .lang {
      background: #d6b35a !important;
      color: #173b2b !important;
      font-weight: bold;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 25px 15px 50px;
    }

    section {
      background: white;
      margin: 18px 0;
      padding: 25px 18px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    .hero {
      text-align: center;
      background: linear-gradient(135deg, #fffdf6, #eee6ce);
      padding: 35px 20px;
    }

    h1 {
      font-size: 29px;
      margin-bottom: 8px;
      color: #164a35;
    }

    h2 {
      color: #164a35;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 17px;
    }

    .call-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 30px;
      background: #164a35;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-size: 19px;
      font-weight: bold;
    }

    form {
      display: grid;
      gap: 13px;
    }

    label {
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #c8c1ae;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    .submit-btn {
      border: 0;
      padding: 14px;
      border-radius: 12px;
      background: #164a35;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn:disabled {
      opacity: .6;
    }

    #status {
      padding: 12px;
      border-radius: 10px;
      display: none;
      text-align: center;
      font-weight: bold;
    }

    .success {
      display: block !important;
      background: #e0f2e7;
      color: #176238;
    }

    .error {
      display: block !important;
      background: #f9e0e0;
      color: #9b2226;
    }

    .question-card {
      border: 1px solid #ddd5c2;
      border-radius: 12px;
      padding: 14px;
      margin: 10px 0;
      background: #fffdf8;
    }

    .question-card small {
      color: #777;
    }

    .dashboard-controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .refresh-btn {
      border: 0;
      padding: 10px 17px;
      border-radius: 20px;
      background: #286846;
      color: white;
      cursor: pointer;
    }

    footer {
      text-align: center;
      background: #123d2c;
      color: white;
      padding: 25px 15px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 600px) {
      .brand {
        font-size: 23px;
      }

      h1 {
        font-size: 25px;
      }

      nav {
        overflow-x: auto;
        justify-content: flex-start;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">✝</div>

  <div

    data-am="ቤተ ሊቃውንት"
    data-en="Bete-Liqawunt">
    ቤተ ሊቃውንት

  <div

    data-en="Spiritual Question and Answer Call Center">
    የመንፈሳዊ ጥያቄና መልስ የጥሪ ማዕከል

  <div class="number">2721</div>
</header>

<nav>

  <button onclick="goTo('ask')" data-am="ጥያቄ ይጠይቁ" data-en="Ask a Question">ጥያቄ ይጠይቁ</button>
  <button onclick="goTo('dashboard')" data-am="Dashboard" data-en="Dashboard">Dashboard</button>

<main>

  <section id="home" class="hero">
    <h1

      መንፈሳዊ ሕይወትዎን በእውቀት ይደግፉ

    <a class="call-btn" href="tel:2721">📞 2721</a>
  </section>

  <section id="ask">

      መንፈሳዊ ጥያቄዎን ይላኩ
    </h2>

    <form id="questionForm">

      <div>
        <label
          for="name"
          data-am="ስም"
          data-en="Name">
          ስም
        </label>
        <input id="name" type="text" placeholder="ስምዎን ያስገቡ">
      </div>

      <div>
        <label
          for="email"
          data-am="Email"
          data-en="Email">

        </label>
        <input id="email" type="email" placeholder="Email">
      </div>

      <div>
        <label
          for="question"
          data-am="ጥያቄ"
          data-en="Question">
          ጥያቄ
        </label>
        <textarea
          id="question"
          required
          placeholder="ጥያቄዎን በዝርዝር ይጻፉ..."></textarea>
      </div>

      <button
        id="submitBtn"
        class="submit-btn"
        type="submit"
        data-am="ጥያቄውን ላክ"
        data-en="Send Question">
        ጥያቄውን ላክ
      </button>

      <div id="status"></div>
    </form>
  </section>

  <section id="dashboard">
    <h2
      data-am="የተመዘገቡ ጥያቄዎች"

      የተመዘገቡ ጥያቄዎች
    </h2>

    <div class="dashboard-controls">
      <button class="refresh-btn" onclick="loadQuestions()">
        🔄 <span data-am="አድስ" data-en="Refresh">አድስ</span>
      </button>
    </div>

    <div id="questionsList">
      ጥያቄዎችን በመጫን ላይ...
    </div>
  </section>

  <section>
    <h2
      data-am="እኛን ለማግኘት"
      data-en="Contact Us">
      እኛን ለማግኘት
    </h2>

    <p>📞 0962244464</p>
    <p>📞 2721</p>
    <p>✉️ ezrasamuel@2721gmail.com</p>
    <p>📍 Addis Ababa, Ethiopia</p>
  </section>

</main>
